services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legendary_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - legendary-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legendary_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - legendary-network

networks:
  legendary-network:
    driver: bridge
